name: Validate site surfaces

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: validate-structured-data.mjs imports globSync from node:fs,
          # which does not exist on Node 20 (the gate failed on every run).
          node-version: 22
      # Sitemap ↔ llms.txt/llms-full.txt coverage (every public URL must be
      # present in both AI guides — catches the recurring desync class)
      - name: AI guide coverage
        run: node scripts/validate-ai-guide-coverage.mjs
      # JSON-LD parses and follows house rules on every page
      - name: Structured data
        run: node scripts/validate-structured-data.mjs
      # No self-serving Review/AggregateRating markup (Google policy)
      - name: Review schema policy
        run: node scripts/validate-review-schema.mjs
      - name: facts.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('facts.json','utf8')); console.log('facts.json OK')"
      # The website's prices are a PROJECTION of the CRM pricing catalog. This re-derives
      # every generated file in memory and fails if a committed byte differs — so a price
      # edited by hand in calculator.js, main.js, a blog table or llms.txt turns the build
      # red instead of shipping a figure that is in no catalog. It also re-checks the sha256
      # of the vendored catalog against the literal pinned in the CRM.
      - name: Calculator prices match the pricing catalog
        run: node scripts/generate-calculator-prices.mjs --check
      # Unit tests (tests/*.test.js and *.test.mjs) — the calculator price-animation regression,
      # the quote-state snapshot sweep and the content contracts. These existed
      # but nothing ran them, so every one of them was unenforced on PRs.
      # Bare `node --test` is deliberate over an explicit glob: it uses Node's
      # own discovery (any *.test.js / *-test.js / test-*.js / test/**, anywhere
      # in the repo) and skips node_modules, so a test added outside tests/ is
      # still gated. Whole suite is ~2s.
      - name: Unit tests
        run: node --test
